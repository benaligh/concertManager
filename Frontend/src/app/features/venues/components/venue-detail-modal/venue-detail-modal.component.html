<div class="modal-overlay" (click)="onBackdropClick($event)" *ngIf="venue">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <div class="header-content">
        <div class="header-icon">
          <svg width="32" height="32" viewBox="0 0 20 20" fill="none">
            <path d="M10 10C11.3807 10 12.5 8.88071 12.5 7.5C12.5 6.11929 11.3807 5 10 5C8.61929 5 7.5 6.11929 7.5 7.5C7.5 8.88071 8.61929 10 10 10Z" stroke="currentColor" stroke-width="2"/>
            <path d="M10 18C13 14 17 10.5 17 7.5C17 4.46243 14.5376 2 10 2C5.46243 2 3 4.46243 3 7.5C3 10.5 7 14 10 18Z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="header-text">
          <h2 class="modal-title">{{ venue.name }}</h2>
          <p class="modal-subtitle">Détails de la salle</p>
        </div>
      </div>
      <button class="close-btn" (click)="onClose()" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="detail-grid">
        <div class="detail-section">
          <h3 class="section-title">Informations</h3>
          <div class="detail-items">
            <div class="detail-item">
              <div class="detail-label">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M10 10C11.3807 10 12.5 8.88071 12.5 7.5C12.5 6.11929 11.3807 5 10 5C8.61929 5 7.5 6.11929 7.5 7.5C7.5 8.88071 8.61929 10 10 10Z" stroke="currentColor" stroke-width="2"/>
                  <path d="M10 18C13 14 17 10.5 17 7.5C17 4.46243 14.5376 2 10 2C5.46243 2 3 4.46243 3 7.5C3 10.5 7 14 10 18Z" stroke="currentColor" stroke-width="2"/>
                </svg>
                Ville
              </div>
              <div class="detail-value">{{ venue.city }}</div>
            </div>

            <div class="detail-item">
              <div class="detail-label">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M3 3H17V17H3V3Z" stroke="currentColor" stroke-width="2"/>
                  <path d="M3 8H17" stroke="currentColor" stroke-width="2"/>
                  <path d="M8 3V17" stroke="currentColor" stroke-width="2"/>
                </svg>
                Adresse
              </div>
              <div class="detail-value">{{ venue.address }}</div>
            </div>

            <div class="detail-item">
              <div class="detail-label">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <circle cx="10" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M3 13C3 10.5 5.23858 8.5 8 8.5C10.7614 8.5 13 10.5 13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                Capacité
              </div>
              <div class="detail-value">
                <span class="capacity-badge">{{ venue.capacity }} places</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary" (click)="onClose()" type="button">Fermer</button>
    </div>
  </div>
</div>
