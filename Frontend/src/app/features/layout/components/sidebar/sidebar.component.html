<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 3L12 21M6 9L6 15M18 9L18 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text" *ngIf="!collapsed">Concert Manager</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.route === '/' }"
      class="nav-item"
      [title]="collapsed ? item.label : ''"
    >
      <span class="nav-icon">
        <svg *ngIf="item.icon === 'dashboard'" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 3H8V8H3V3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 3H17V8H12V3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 12H8V17H3V12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 12H17V17H12V12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg *ngIf="item.icon === 'upload'" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 3V13M10 3L6 7M10 3L14 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 17H17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg *ngIf="item.icon === 'music'" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M9 18V5L17 3V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6" cy="16" r="2" stroke="currentColor" stroke-width="2"/>
          <circle cx="14" cy="14" r="2" stroke="currentColor" stroke-width="2"/>
        </svg>
        <svg *ngIf="item.icon === 'location'" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 10C11.3807 10 12.5 8.88071 12.5 7.5C12.5 6.11929 11.3807 5 10 5C8.61929 5 7.5 6.11929 7.5 7.5C7.5 8.88071 8.61929 10 10 10Z" stroke="currentColor" stroke-width="2"/>
          <path d="M10 18C13 14 17 10.5 17 7.5C17 4.46243 14.5376 2 10 2C5.46243 2 3 4.46243 3 7.5C3 10.5 7 14 10 18Z" stroke="currentColor" stroke-width="2"/>
        </svg>
        <svg *ngIf="item.icon === 'calendar'" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M3 8H17" stroke="currentColor" stroke-width="2"/>
          <path d="M7 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M13 2V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item collapse-btn" (click)="onToggle()" [title]="collapsed ? 'Expandir' : 'Réduire'">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 7.5L7.5 12.5M7.5 7.5L12.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!collapsed">Réduire</span>
    </button>
    <a class="nav-item logout-btn" (click)="logout()" [title]="collapsed ? 'Déconnexion' : ''">
      <span class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M7.5 10H17.5M17.5 10L14.5 7M17.5 10L14.5 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.5 5C2.5 4.17157 3.17157 3.5 4 3.5H9.5C10.3284 3.5 11 4.17157 11 5V15C11 15.8284 10.3284 16.5 9.5 16.5H4C3.17157 16.5 2.5 15.8284 2.5 15V5Z" stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!collapsed">Déconnexion</span>
    </a>
  </div>
</aside>
