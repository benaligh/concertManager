<div class="modal-overlay" (click)="onBackdropClick($event)" *ngIf="data">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header" [style.background]="getHeaderBg()">
      <div class="header-content">
        <div class="header-icon" [style.background]="getIconBg()">
          <svg *ngIf="data?.type === 'danger'" width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M12 9V13M12 17H12.01M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngIf="data?.type === 'warning'" width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18C1.64547 18.3024 1.55299 18.6453 1.55201 18.9945C1.55103 19.3437 1.64158 19.6871 1.81445 19.9905C1.98733 20.2939 2.23675 20.5467 2.53773 20.7238C2.83871 20.9009 3.18082 20.9962 3.53 21H20.47C20.8192 20.9962 21.1613 20.9009 21.4623 20.7238C21.7633 20.5467 22.0127 20.2939 22.1856 19.9905C22.3584 19.6871 22.449 19.3437 22.448 18.9945C22.447 18.6453 22.3545 18.3024 22.18 18L13.71 3.86C13.5325 3.56611 13.2805 3.32311 12.9812 3.15447C12.6819 2.98584 12.3438 2.89725 12 2.89725C11.6562 2.89725 11.3181 2.98584 11.0188 3.15447C10.7195 3.32311 10.4675 3.56611 10.29 3.86Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngIf="!data?.type || data?.type === 'info'" width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2"/>
            <path d="M12 16V12M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="header-text">
          <h2 class="modal-title">{{ data.title }}</h2>
        </div>
      </div>
    </div>

    <div class="modal-body">
      <p class="confirm-message">{{ data.message }}</p>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="onCancel()" type="button">
        {{ data.cancelText || 'Annuler' }}
      </button>
      <button 
        class="btn" 
        [class.btn-danger]="data?.type === 'danger'"
        [class.btn-warning]="data?.type === 'warning'"
        [class.btn-primary]="!data?.type || data?.type === 'info'"
        (click)="onConfirm()" 
        type="button"
      >
        {{ data.confirmText || 'Confirmer' }}
      </button>
    </div>
  </div>
</div>
